# The Docs origin: plain HTTP on 8080 behind the tunnel, which sends both public hostnames here. It writes nothing but
# its pid and temporary files under /tmp (a tmpfs), logs errors to stderr, and runs as the image's non-root identity.
daemon off;
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr notice;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    include /etc/nginx/mime.types;
    types {
        text/markdown md;
        text/plain py sh sha256;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain text/xml text/markdown application/javascript application/json image/svg+xml;

    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    absolute_redirect off;
    port_in_redirect off;
    merge_slashes on;
    autoindex off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/plain text/xml text/markdown application/javascript application/json application/xml
        application/atom+xml application/rss+xml application/wasm image/svg+xml;

    # Every response, errors included, carries the complete security policy. A location that adds its own header
    # must include this snippet again: nginx inherits add_header only into a level that declares none.
    include /etc/nginx/security-headers.conf;

    # A missing URL is a real 404, never a fallback page; a directory without an index is missing too.
    error_page 403 404 =404 @missing;

    # docs.shimpz.com and any other Host. Prerendered routes are directories (trailingSlash=always): a directory
    # request without its slash is redirected to the canonical URL with its query kept.
    server {
        listen 8080 default_server;
        server_name docs.shimpz.com;
        root /srv;
        index index.html;

        location / {
        }

        location @missing {
            types {
            }
            default_type text/plain;
            return 404 "Not found\n";
        }
    }

    # install.shimpz.com serves only the bootstrap, at / and /install.sh, uncached so every invocation resolves the
    # current digest-pinning release.
    server {
        listen 8080;
        server_name install.shimpz.com;
        root /srv;

        location = / {
            include /etc/nginx/installer.conf;
        }

        location = /install.sh {
            include /etc/nginx/installer.conf;
        }

        location / {
            return 404;
        }

        location @missing {
            types {
            }
            default_type text/plain;
            return 404 "Not found\n";
        }
    }
}
